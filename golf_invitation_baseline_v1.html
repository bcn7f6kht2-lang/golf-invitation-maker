<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ゴルフコンペ案内メーカー｜動作基準版</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#24332b}*{box-sizing:border-box}body{margin:0;background:#f6f8f6}.wrap{max-width:650px;margin:auto;padding:18px}h1{font-size:22px;margin:8px 0}p{line-height:1.6}.note{font-size:13px;color:#54635a}.panel{background:white;border-radius:15px;padding:16px;margin:14px 0;box-shadow:0 2px 10px #0000000a}label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}input,select,button{font:inherit}input,select{width:100%;border:1px solid #cbd5ce;border-radius:9px;padding:12px;background:white;font-size:16px}button{border:0;border-radius:10px;padding:13px 15px;font-weight:700;cursor:pointer}.themes{display:flex;gap:8px;flex-wrap:wrap}.themes button{background:#e5eae5;color:#284334;flex:1;min-width:95px}.themes button[aria-pressed=true]{background:#287a48;color:white}.preview{border-radius:15px;padding:25px 20px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}.preview h2{text-align:center;font-size:23px;margin:10px 0 20px;white-space:normal}.preview .top{text-align:center;font-size:11px;letter-spacing:2px}.preview .flag{text-align:center;font-size:46px;margin:10px}.preview.golf{background:#e7f2df;color:#264c30}.preview.classic{background:#253c34;color:#f5e8c9}.preview.simple{background:#f1f3f5;color:#273541}.copy{background:#287a48;color:white;width:100%;margin-top:12px}.status{min-height:25px;color:#216e40;font-size:14px}footer{font-size:12px;color:#66736a;margin:18px 0}</style></head><body><main class="wrap"><h1>⛳ ゴルフコンペ案内メーカー</h1><p class="note">動作基準版：背景切り替え・入力反映・日付選択・金額選択・文章コピー。画像保存機能はまだ追加していません。</p><section class="panel"><label>背景デザイン</label><div class="themes" role="group" aria-label="背景デザイン"><button type="button" data-theme="golf" aria-pressed="true">ゴルフ場</button><button type="button" data-theme="classic" aria-pressed="false">高級感</button><button type="button" data-theme="simple" aria-pressed="false">シンプル</button></div><label for="name">コンペ名</label><input id="name" value="親睦ゴルフコンペ"><label for="date">開催日（カレンダーから選択）</label><input id="date" type="date" value="2026-12-06"><label for="course">ゴルフ場</label><input id="course" value="〇〇ゴルフクラブ"><label for="start">スタート時間</label><input id="start" type="time" value="09:00"><label for="fee">参加費</label><select id="fee"><option value="0">無料</option><option value="1000">1,000円</option><option value="2000">2,000円</option><option value="3000" selected>3,000円</option><option value="4000">4,000円</option><option value="5000">5,000円</option><option value="10000">10,000円</option><option value="other">その他（自由入力）</option></select><div id="otherWrap" hidden><label for="otherFee">参加費（円）</label><input id="otherFee" type="number" min="0" step="100" value="3500"></div><label for="deadline">参加締切（カレンダーから選択）</label><input id="deadline" type="date" value="2026-11-25"></section><section class="panel"><div id="preview" class="preview golf"><div class="top">GOLF COMPETITION INVITATION</div><div class="flag">⛳</div><h2 id="previewTitle"></h2><div id="previewBody"></div></div><button class="copy" id="copy" type="button">📋 案内文をコピー</button><p class="status" id="status" role="status"></p></section><footer>このファイルはオフラインでも利用できます。画像化・公開URL・LINE画像共有は未実装です。</footer></main><script>(function(){'use strict';const $=id=>document.getElementById(id);const ids=['name','date','course','start','fee','otherFee','deadline'];let theme='golf';let message='';function formatDate(v){if(!v)return '未設定';const a=v.split('-');return a.length===3?`${Number(a[0])}年${Number(a[1])}月${Number(a[2])}日`:v}function feeText(){const v=$('fee').value;return v==='other'?Number($('otherFee').value||0).toLocaleString('ja-JP')+'円':v==='0'?'無料':Number(v).toLocaleString('ja-JP')+'円'}function update(){const name=$('name').value||'ゴルフコンペ';const date=formatDate($('date').value);const course=$('course').value||'未設定';const start=$('start').value||'未設定';const fee=feeText();const deadline=formatDate($('deadline').value);$('otherWrap').hidden=$('fee').value!=='other';message=`⛳ ${name}\n\n皆さん、お疲れさまです！\nゴルフコンペを開催します。\n\n📅 開催日：${date}\n🏌️ ゴルフ場：${course}\n🕘 スタート：${start}\n💰 参加費：${fee}\n📝 参加締切：${deadline}\n\nぜひご参加ください！`;$('previewTitle').textContent=name;$('previewBody').textContent=`開催日：${date}\nゴルフ場：${course}\nスタート：${start}\n参加費：${fee}\n参加締切：${deadline}\n\n皆さまのご参加をお待ちしています！`;$('preview').className='preview '+theme;$('status').textContent=''}for(const id of ids){$(id).addEventListener('input',update);$(id).addEventListener('change',update)}document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));update()}));$('copy').addEventListener('click',async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(message)}else{const ta=document.createElement('textarea');ta.value=message;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy unsupported')}$('status').textContent='コピーしました。LINEに貼り付けて確認してください。'}catch(e){$('status').textContent='自動コピーできませんでした。プレビューの文章を長押ししてコピーしてください。'}});update()})();</script></body></html>
